spring:
  application:
    name: DentalCloudBackend
  datasource:
    # Usaremos las variables de entorno para que Docker Compose las inyecte
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:1296000000}
dentalcloud:
  storage:
    local-root: ${DENTALCLOUD_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/dentalcloud-private}
  documents:
    signing-secret: ${DOCUMENT_DOWNLOAD_SECRET:${jwt.secret}}
    download-ttl-seconds: ${DOCUMENT_DOWNLOAD_TTL_SECONDS:300}
