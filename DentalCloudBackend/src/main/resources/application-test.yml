spring:
  datasource:
    url: jdbc:h2:mem:dentalcloud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
jwt:
  secret: test-secret-key-for-dentalcloud-tests-1234567890
  expiration-ms: 3600000
