name: Backend quality

on:
  push:
    branches: [main, master, develop, Develop]
  pull_request:
    branches: [main, master, develop, Develop]

defaults:
  run:
    working-directory: DentalCloudBackend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DentalCloudBackend/pom.xml

      - name: Run backend verification
        run: ./mvnw -B verify
